name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-parse-script-ubuntu:
    name: Test parse-past-meetings.sh (ubuntu-latest)
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.changes.outputs.run_macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check if macOS test is needed
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1 && git cat-file -e HEAD^1^{tree} 2>/dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(script/|\.github/workflows/)'; then
            echo "run_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_macos=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test parse-past-meetings.sh
        run: |
          bash -n script/*.sh
          chmod +x script/parse-past-meetings.sh
          script/parse-past-meetings.sh > /tmp/meetings-output.md
          # Verify output contains expected content
          if ! grep -q "## Past Meetings" /tmp/meetings-output.md; then
            echo "Error: Output missing expected '## Past Meetings' header"
            exit 1
          fi
          echo "✓ parse-past-meetings.sh executed successfully on ubuntu-latest"

  test-parse-script-macos:
    name: Test parse-past-meetings.sh (macos-latest)
    runs-on: macos-latest
    needs: test-parse-script-ubuntu
    if: github.event_name == 'pull_request' && needs.test-parse-script-ubuntu.outputs.run_macos == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Test parse-past-meetings.sh
        run: |
          bash -n script/*.sh
          chmod +x script/parse-past-meetings.sh
          script/parse-past-meetings.sh > /tmp/meetings-output.md
          # Verify output contains expected content
          if ! grep -q "## Past Meetings" /tmp/meetings-output.md; then
            echo "Error: Output missing expected '## Past Meetings' header"
            exit 1
          fi
          echo "✓ parse-past-meetings.sh executed successfully on macos-latest"

  test-sync-photos:
    name: Test sync-photos.go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # No go.sum (stdlib only), so there is nothing to cache.
          cache: false
      - name: Run unit tests
        run: go test -v -cover ./script/...

  build:
    runs-on: ubuntu-latest
    name: script/cibuild
    needs: [test-parse-script-ubuntu, test-parse-script-macos, test-sync-photos]
    if: >-
      !cancelled() &&
      needs.test-parse-script-ubuntu.result == 'success' &&
      (needs.test-parse-script-macos.result == 'success' || needs.test-parse-script-macos.result == 'skipped') &&
      needs.test-sync-photos.result == 'success'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
      - name: page checks
        run: script/check-pages
      - name: Upload site artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
      # A fork's Pages site is usually served from /<repo>/, so prefix the
      # site's root-relative links for its preview. Never runs in PAARA-org.
      - name: Get fork Pages path
        id: pages
        if: success() && github.repository != 'PAARA-org/paara-org.github.io' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Prefix links for fork Pages preview
        if: steps.pages.outcome == 'success'
        run: script/prefix-baseurl _site "${{ steps.pages.outputs.base_path }}"
      - name: Upload Pages artifact
        if: success() && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/master' && github.event_name == 'push'))
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

