name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-parse-script:
    name: Test parse-past-meetings.sh
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Test parse-past-meetings.sh
        run: |
          chmod +x script/parse-past-meetings.sh
          script/parse-past-meetings.sh > /tmp/meetings-output.md
          # Verify output contains expected content
          if ! grep -q "## Past Meetings" /tmp/meetings-output.md; then
            echo "Error: Output missing expected '## Past Meetings' header"
            exit 1
          fi
          echo "✓ parse-past-meetings.sh executed successfully on ${{ matrix.os }}"

  test-sync-photos:
    name: Test sync-photos.go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # No go.sum (stdlib only), so there is nothing to cache.
          cache: false
      - name: Run unit tests
        run: go test -v -cover ./script/...

  build:
    runs-on: ubuntu-latest
    name: script/cibuild
    needs: [test-parse-script, test-sync-photos]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
      - name: page checks
        run: script/check-pages
      - name: Upload site artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
      # A fork's Pages site is usually served from /<repo>/, so prefix the
      # site's root-relative links for its preview. Never runs in PAARA-org.
      - name: Get fork Pages path
        id: pages
        if: success() && github.repository != 'PAARA-org/paara-org.github.io' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Prefix links for fork Pages preview
        if: steps.pages.outcome == 'success'
        run: script/prefix-baseurl _site "${{ steps.pages.outputs.base_path }}"
      - name: Upload Pages artifact
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

